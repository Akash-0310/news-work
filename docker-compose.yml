services:
  postgres:
    image: postgres:16-alpine
    container_name: newsflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: newsflow
      POSTGRES_PASSWORD: newsflow
      POSTGRES_DB: newsflow
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U newsflow -d newsflow']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: newsflow-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      # Context is the repository root, not server/: this is an npm workspace and
      # `npm ci` needs the root package-lock.json to install reproducibly.
      context: .
      dockerfile: server/Dockerfile
      target: runtime
    container_name: newsflow-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://newsflow:newsflow@postgres:5432/newsflow?schema=public
      REDIS_URL: redis://redis:6379
      CLIENT_URL: http://localhost:5173
    env_file:
      - .env
    ports:
      - '4000:4000'
    # Apply migrations before serving so a fresh volume comes up ready.
    command: sh -c "npx prisma migrate deploy && node dist/server.js"
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Ingestion workers. Behind a profile until Phase 3 ships dist/workers/index.js:
  # without this, `docker compose up` would start a container that crash-loops on a
  # missing entrypoint. Enable with: docker compose --profile worker up
  worker:
    profiles: ['worker']
    build:
      context: .
      dockerfile: server/Dockerfile
      target: runtime
    container_name: newsflow-worker
    restart: unless-stopped
    depends_on:
      server:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://newsflow:newsflow@postgres:5432/newsflow?schema=public
      REDIS_URL: redis://redis:6379
    env_file:
      - .env
    command: node dist/workers/index.js

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        # Baked at build time — Vite inlines VITE_* into the bundle.
        VITE_API_BASE_URL: http://localhost:4000/api
        VITE_WS_URL: ws://localhost:4000
    container_name: newsflow-web
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - '5173:80'

volumes:
  postgres-data:
  redis-data:
