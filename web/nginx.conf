server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Do not advertise the nginx version.
  server_tokens off;

  # Security headers. The API sets its own; these protect the HTML document.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

  # Vite emits content-hashed filenames (index-BH5qfFbu.js), so these files are
  # immutable: a change produces a new name. Cache them for a year.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html must NEVER be cached. It is the file that points at the hashed assets,
  # so a stale copy pins users to a deleted bundle and the app fails to load after a
  # deploy with "Failed to fetch dynamically imported module".
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate";
    expires off;
  }

  # SPA history fallback: the client router owns /category/technology, /article/:id and
  # the rest, so any unmatched path must return index.html rather than 404.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Do not log favicon noise.
  location = /favicon.ico {
    access_log off;
    log_not_found off;
    try_files $uri =204;
  }
}
